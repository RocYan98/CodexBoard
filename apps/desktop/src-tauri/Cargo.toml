[package]
name = "codexboard-desktop"
version = "1.0.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-updater = "=2.10.1"
reqwest = { version = "=0.13.4", default-features = false, features = ["system-proxy", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
flate2 = "1"
tar = "0.4"
[dev-dependencies]
base64 = "=0.22.1"
minisign-verify = "=0.2.5"
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
