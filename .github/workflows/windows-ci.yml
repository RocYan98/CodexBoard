name: Windows installer build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  CI: "true"
  FORCE_COLOR: "0"

jobs:
  installer:
    name: Windows x64 / Installer
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Preserve repository bytes on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Windows installer with verified runtime assets
        run: node apps/desktop/scripts/build-windows.mjs
      - name: Upload installer and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-installer-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: apps/desktop/dist/windows-x64/
