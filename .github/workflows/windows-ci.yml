name: Windows build and validation

on:
  push:
    branches: [feature/windows-ci]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  CI: "true"
  FORCE_COLOR: "0"

jobs:
  build:
    name: Windows x64 / Node and web build
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Preserve repository bytes on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install locked dependencies
        id: install
        run: npm ci --no-audit --no-fund
      - name: Build all Node and web workspaces
        id: build
        run: npm run build
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Describe build artifact
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          @{
            commit = $env:GITHUB_SHA
            runner = 'windows-2022'
            architecture = 'x64'
            node = (node --version)
            scope = 'Compiled Node workspaces and web assets; not a desktop installer or a bundled runtime.'
            desktopValidated = $false
            codexIntegrationValidated = $false
          } | ConvertTo-Json | Set-Content -Encoding utf8 build-info.json
      - name: Upload compiled assets
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-node-web-build-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            build-info.json
            apps/server/dist/
            apps/web/dist/
            packages/contracts/dist/
            packages/taskctl/dist/

  tests:
    name: Windows x64 / ${{ matrix.suite }} tests
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [contracts, taskctl, server, web, scripts, desktop-scripts]
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
    steps:
      - name: Preserve repository bytes on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build test prerequisites
        run: |
          npm run build -w @codexboard/contracts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build -w @codexboard/taskctl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ('${{ matrix.suite }}' -eq 'desktop-scripts') {
            npm run build -w @codexboard/server
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run build -w @codexboard/web
          }
      - name: Install browser engines for desktop UI tests
        if: matrix.suite == 'desktop-scripts'
        run: npx --no-install playwright install chromium webkit
      - name: Run complete suite
        timeout-minutes: 20
        run: node scripts/run-ci-tests.mjs ${{ matrix.suite }}
      - name: Upload test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-tests-${{ matrix.suite }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: test-results/windows/${{ matrix.suite }}/

  desktop-check:
    name: Windows x64 / Desktop Rust compilation and Node launch
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Preserve repository bytes on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Test the native Node launch boundary
        run: |
          New-Item -ItemType Directory -Force test-results/windows/desktop-check | Out-Null
          $launchTests = Join-Path $env:RUNNER_TEMP 'codexboard-node-launch-tests.exe'
          rustc --edition=2021 --test apps/desktop/src-tauri/src/node_command.rs -o $launchTests 2>&1 |
            Tee-Object -FilePath test-results/windows/desktop-check/node-launch-compile.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $launchTests --nocapture 2>&1 |
            Tee-Object -FilePath test-results/windows/desktop-check/node-launch-tests.log
          $launchExitCode = $LASTEXITCODE
          @{
            commit = $env:GITHUB_SHA
            exitCode = $launchExitCode
            scope = 'Native command builder launches actual Node scripts from canonical Windows paths.'
          } | ConvertTo-Json | Set-Content -Encoding utf8 test-results/windows/desktop-check/node-launch-result.json
          exit $launchExitCode
      - name: Check desktop code and test targets
        if: ${{ !cancelled() }}
        run: |
          New-Item -ItemType Directory -Force test-results/windows/desktop-check | Out-Null
          rustc --version | Out-File test-results/windows/desktop-check/toolchain.txt
          cargo --version | Out-File -Append test-results/windows/desktop-check/toolchain.txt
          cargo check --locked --all-targets --manifest-path apps/desktop/src-tauri/Cargo.toml 2>&1 |
            Tee-Object -FilePath test-results/windows/desktop-check/cargo-check.log
          $checkExitCode = $LASTEXITCODE
          @{
            commit = $env:GITHUB_SHA
            exitCode = $checkExitCode
            scope = 'Compilation only; installer and live Codex integration are not exercised.'
          } | ConvertTo-Json | Set-Content -Encoding utf8 test-results/windows/desktop-check/result.json
          exit $checkExitCode
      - name: Upload compiler evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-desktop-check-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: test-results/windows/desktop-check/

  installer:
    name: Windows x64 / Test installer
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Preserve repository bytes on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Windows test installer with verified runtime assets
        run: node apps/desktop/scripts/build-windows.mjs
      - name: Upload test installer and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-test-installer-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: apps/desktop/dist/windows-x64/

  summary:
    name: Windows baseline summary
    if: ${{ always() }}
    needs: [build, tests, desktop-check, installer]
    runs-on: windows-2022
    timeout-minutes: 5
    env:
      BUILD_RESULT: ${{ needs.build.result }}
      TEST_RESULT: ${{ needs.tests.result }}
      DESKTOP_RESULT: ${{ needs.desktop-check.result }}
      INSTALLER_RESULT: ${{ needs.installer.result }}
    steps:
      - name: Summarize without suppressing failures
        run: |
          @"
          # Windows x64 compatibility baseline

          | Check | Result |
          | --- | --- |
          | Node and web build, typecheck, lint | $env:BUILD_RESULT |
          | All six test suites | $env:TEST_RESULT |
          | Desktop Rust compilation and native Node launch | $env:DESKTOP_RESULT |
          | Windows test installer | $env:INSTALLER_RESULT |

          Download per-suite logs, JUnit reports and compiled assets from this run's artifacts.
          The installer is an unsigned test artifact, not a Release. A logged-in Codex desktop session is validated separately.
          A failed check is an unresolved compatibility issue or infrastructure error; inspect its log.
          "@ | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if (@($env:BUILD_RESULT, $env:TEST_RESULT, $env:DESKTOP_RESULT, $env:INSTALLER_RESULT) | Where-Object { $_ -ne 'success' }) {
            exit 1
          }
